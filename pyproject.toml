[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "news-finance-v2"
version = "2.0.0"
description = "Auditable forward-looking market research pipeline"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12",
  "exchange-calendars>=4.5",
  "openai>=1.40",
  "python-dotenv>=1.0",
  "requests>=2.31",
  "yfinance>=0.2.40",
]

[project.optional-dependencies]
browser = ["playwright>=1.45"]
test = ["pytest>=8.0,<9"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
