name: Daily investment report

on:
  workflow_dispatch:
  schedule:
    - cron: "10 09 * * *"
      timezone: "America/New_York"

concurrency:
  group: daily-investment-report
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
      AI_PROVIDER: openai
      AI_MODEL: ${{ vars.AI_MODEL || 'gpt-5.4-mini' }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      PROMPT_VERSION: v2.4-government-layout
      HTTP_TIMEOUT: "25"
      CACHE_TTL_HOURS: "20"
      MARKET_COVERAGE_THRESHOLD: "0.80"
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT }}
      SMTP_HOST: ${{ secrets.SMTP_HOST }}
      SMTP_PORT: "465"
      SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
      SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      REPORT_TIMEZONE: America/New_York
      PUBLIC_REPORT_URL: ${{ vars.PUBLIC_REPORT_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[test]"

      - name: Test
        run: python -m pytest -q

      - name: Generate report and send email
        run: python news_finance_v2.py --full --base-dir .

      - name: Stage public site
        run: python -m news_finance_v2.publishing --base-dir .

      - name: Commit latest public snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs
          git diff --cached --quiet || git commit -m "chore: update daily report $(date -u +%F)"
          git push

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
